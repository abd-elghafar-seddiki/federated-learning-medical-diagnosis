<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malaria Detection - Camera</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', serif;
            background: linear-gradient(135deg, #f8f5f0 0%, #e8ddd4 100%);
            color: #2c3e50;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .camera-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            padding: 40px;
            text-align: center;
            border: 2px solid #e8ddd4;
            max-width: 500px;
            width: 100%;
        }

        .camera-container h1 {
            color: #2c3e50;
            font-size: 2em;
            margin-bottom: 30px;
            font-family: 'Georgia', serif;
            border-bottom: 3px solid #d4af37;
            padding-bottom: 15px;
        }

        #camera {
            width: 100%;
            max-width: 300px;
            height: 400px;
            border-radius: 15px;
            border: 3px solid #d4af37;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            margin-bottom: 25px;
            background-color: #f8f5f0;
        }

        .btn {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #d4af37;
            margin: 10px;
            text-decoration: none;
            display: inline-block;
            font-family: 'Times New Roman', serif;
        }

        .btn:hover {
            background: linear-gradient(135deg, #b8860b 0%, #8b6914 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212,175,55,0.4);
        }

        .back {
            background: linear-gradient(135deg, #7f8c8d 0%, #95a5a6 100%);
            border-color: #7f8c8d;
        }

        .back:hover {
            background: linear-gradient(135deg, #6c7b7d 0%, #7f8c8d 100%);
            box-shadow: 0 8px 20px rgba(127,140,141,0.4);
        }

        #canvas {
            display: none;
        }

        #result {
            margin-top: 25px;
            padding: 20px;
            background: #f8f5f0;
            border-radius: 12px;
            border: 1px solid #e8ddd4;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1em;
        }

        .error {
            color: #e74c3c;
            font-weight: bold;
            background: #fdf2f2;
            border-color: #f8d7da;
        }

        .success {
            color: #27ae60;
            font-weight: bold;
            background: #f0f9f0;
            border-color: #d4edda;
        }

        .loading {
            color: #d4af37;
            font-style: italic;
        }

        .camera-status {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            background: rgba(212, 175, 55, 0.1);
            border-left: 4px solid #d4af37;
            color: #2c3e50;
        }

        @media (max-width: 600px) {
            .camera-container {
                padding: 20px;
                margin: 10px;
            }

            .camera-container h1 {
                font-size: 1.6em;
            }

            #camera {
                max-width: 250px;
                height: 300px;
            }

            .btn {
                padding: 12px 20px;
                font-size: 1em;
                margin: 5px;
            }
        }
    </style>
</head>
<body>
    <div class="camera-container">
        <h1>Malaria Detection - Camera</h1>
        
        <div class="camera-status">
            <strong>Camera Status:</strong> Initializing...
        </div>
        
        <video id="camera" autoplay playsinline></video>
        <button id="capture" class="btn">Capture Image</button>
        <canvas id="canvas" style="display: none;"></canvas>
        <div id="result">Ready to capture blood cell image...</div>
        
        <div style="margin-top: 30px;">
            <a href="{{ url_for('model_home', model_type='malaria') }}" class="btn back">Back to Model</a>
        </div>
    </div>

    <script>
        const video = document.getElementById('camera');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const captureButton = document.getElementById('capture');
        const resultDiv = document.getElementById('result');
        const cameraStatus = document.querySelector('.camera-status');

        const videoWidth = 300;
        const videoHeight = 400;

        cameraStatus.innerHTML = '<strong>Camera Status:</strong> Requesting camera access...';
        
        navigator.mediaDevices.getUserMedia({
            video: {
                width: { ideal: videoWidth },
                height: { ideal: videoHeight },
                facingMode: { ideal: "environment" }
            }
        })
        .then(stream => {
            video.srcObject = stream;
            video.style.width = `${videoWidth}px`;
            video.style.height = `${videoHeight}px`;
            cameraStatus.innerHTML = '<strong>Camera Status:</strong> <span style="color: #27ae60;">Camera active and ready</span>';
            cameraStatus.style.background = 'rgba(39, 174, 96, 0.1)';
            cameraStatus.style.borderLeftColor = '#27ae60';
        })
        .catch(error => {
            console.error('Error accessing the camera', error);
            resultDiv.innerHTML = `<p class="error">Error accessing the camera. Please ensure that your camera is connected and permissions are granted.</p>`;
            cameraStatus.innerHTML = '<strong>Camera Status:</strong> <span style="color: #e74c3c;">Camera access failed</span>';
            cameraStatus.style.background = 'rgba(231, 76, 60, 0.1)';
            cameraStatus.style.borderLeftColor = '#e74c3c';
            captureButton.disabled = true;
            captureButton.style.opacity = '0.5';
        });

        captureButton.addEventListener('click', () => {
            resultDiv.innerHTML = '<p class="loading">Processing image... Please wait.</p>';
            captureButton.disabled = true;
            captureButton.textContent = 'Processing...';
            
            canvas.width = videoWidth;
            canvas.height = videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(blob => {
                const formData = new FormData();
                formData.append('file', blob, 'malaria_capture.jpg');

                fetch('/malaria/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.text())
                .then(data => {
                    resultDiv.innerHTML = data;
                    captureButton.disabled = false;
                    captureButton.textContent = 'Capture Image';
                })
                .catch(error => {
                    console.error('Error uploading the image', error);
                    resultDiv.innerHTML = `<p class="error">Error uploading the image. Please try again.</p>`;
                    captureButton.disabled = false;
                    captureButton.textContent = 'Capture Image';
                });
            }, 'image/jpeg', 0.8);
        });

        video.addEventListener('loadedmetadata', () => {
            captureButton.disabled = false;
        });
    </script>
</body>
</html>
