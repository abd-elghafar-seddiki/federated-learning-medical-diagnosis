<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit User - Admin</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Times New Roman', serif;
            background: linear-gradient(135deg, #f8f5f0 0%, #e8ddd4 100%);
            color: #2c3e50;
            line-height: 1.6;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .admin-header h1 {
            color: #d4af37;
            font-size: 2em;
            font-family: 'Georgia', serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .btn {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid #d4af37;
            display: inline-block;
        }

        .btn:hover {
            background: linear-gradient(135deg, #b8860b 0%, #8b6914 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212,175,55,0.4);
        }

        .edit-user-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            padding: 40px;
            border: 1px solid #e8ddd4;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: bold;
            font-size: 1.1em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e8ddd4;
            border-radius: 8px;
            font-size: 1em;
            font-family: 'Times New Roman', serif;
            background-color: #fff;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212,175,55,0.2);
            transform: translateY(-1px);
        }

        .form-check {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 25px;
        }

        .form-check input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #d4af37;
            cursor: pointer;
        }

        .form-check label {
            color: #2c3e50;
            font-weight: bold;
            cursor: pointer;
        }

        .form-group small {
            color: #95a5a6;
            font-style: italic;
            font-size: 0.9em;
            margin-top: 5px;
            display: block;
        }

        .admin-actions {
            display: flex;
            gap: 20px;
            margin-top: 30px;
            flex-wrap: wrap;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #d4af37;
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #b8860b 0%, #8b6914 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212,175,55,0.4);
        }

        .back {
            background: linear-gradient(135deg, #7f8c8d 0%, #95a5a6 100%);
            border-color: #7f8c8d;
        }

        .back:hover {
            background: linear-gradient(135deg, #6c7b7d 0%, #7f8c8d 100%);
        }

        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .edit-user-container {
                padding: 20px;
            }

            .admin-actions {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Edit User: {{ user['first_name'] }} {{ user['last_name'] }}</h1>
            <a href="{{ url_for('admin_dashboard') }}" class="btn">Back to Dashboard</a>
        </div>

        <div class="edit-user-container">
            <form action="{{ url_for('admin_edit_user', user_id=user['id']) }}" method="POST">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">First Name:</label>
                        <input type="text" id="first_name" name="first_name" value="{{ user['first_name'] }}" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name:</label>
                        <input type="text" id="last_name" name="last_name" value="{{ user['last_name'] }}" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="birth_date">Birth Date:</label>
                        <input type="date" id="birth_date" name="birth_date" value="{{ user['birth_date'] }}" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" value="{{ user['phone'] }}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="hospital">Hospital/Institution:</label>
                    <input type="text" id="hospital" name="hospital" value="{{ user['hospital'] }}" required>
                </div>
                
                <div class="form-group">
                    <label for="user_type">Professional Type:</label>
                    <select id="user_type" name="user_type" required>
                        <option value="government_doctor" {% if user['user_type'] == 'government_doctor' %}selected{% endif %}>Government Doctor</option>
                        <option value="private_doctor" {% if user['user_type'] == 'private_doctor' %}selected{% endif %}>Private Doctor</option>
                        <option value="researcher" {% if user['user_type'] == 'researcher' %}selected{% endif %}>Medical Researcher</option>
                        <option value="other" {% if user['user_type'] == 'other' %}selected{% endif %}>Other Medical Professional</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" value="{{ user['email'] }}" required>
                </div>
                
                <div class="form-check">
                    <input type="checkbox" id="is_active" name="is_active" {% if user['is_active'] %}checked{% endif %}>
                    <label for="is_active">Active User</label>
                </div>
                
                <div class="form-group">
                    <label for="password">New Password:</label>
                    <input type="password" id="password" name="password">
                    <small>Leave blank to keep current password</small>
                </div>
                
                <div class="admin-actions">
                    <button type="submit" class="btn">Update User</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn back">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
