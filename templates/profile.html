<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', serif;
            background: linear-gradient(135deg, #f8f5f0 0%, #e8ddd4 100%);
            color: #2c3e50;
            line-height: 1.6;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #34495e 0%, #2c3e50 100%);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #d4af37;
            font-size: 2em;
            font-family: 'Georgia', serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-info span {
            color: #ecf0f1;
            font-size: 1.1em;
            font-weight: 500;
        }

        .logout-btn {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: white;
            padding: 10px 20px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid #d4af37;
        }

        .logout-btn:hover {
            background: linear-gradient(135deg, #b8860b 0%, #8b6914 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212,175,55,0.4);
        }

        .profile-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 1px solid #e8ddd4;
        }

        .profile-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 30px;
            background: linear-gradient(135deg, #f8f5f0 0%, #e8ddd4 100%);
            border-bottom: 2px solid #d4af37;
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8em;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
            border: 3px solid #fff;
            box-shadow: 0 4px 15px rgba(212,175,55,0.3);
        }

        .user-details h2 {
            color: #2c3e50;
            font-size: 1.8em;
            margin-bottom: 8px;
            font-family: 'Georgia', serif;
        }

        .user-details p {
            color: #7f8c8d;
            margin-bottom: 5px;
            font-size: 1.1em;
        }

        .btn {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid #d4af37;
            display: inline-block;
        }

        .btn:hover {
            background: linear-gradient(135deg, #b8860b 0%, #8b6914 100%);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(212,175,55,0.4);
        }

        .profile-form {
            padding: 40px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: bold;
            font-size: 1.1em;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e8ddd4;
            border-radius: 8px;
            font-size: 1em;
            font-family: 'Times New Roman', serif;
            background-color: #fff;
            transition: all 0.3s ease;
        }

        .form-group input:focus,
        .form-group select:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212,175,55,0.2);
            transform: translateY(-1px);
        }

        .form-group input[readonly] {
            background-color: #f8f5f0;
            color: #7f8c8d;
            cursor: not-allowed;
        }

        .password-info {
            font-size: 0.9em;
            color: #95a5a6;
            font-style: italic;
            margin-top: 5px;
        }

        button[type="submit"] {
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: white;
            padding: 15px 35px;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid #d4af37;
        }

        button[type="submit"]:hover {
            background: linear-gradient(135deg, #b8860b 0%, #8b6914 100%);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212,175,55,0.4);
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                text-align: center;
            }

            .profile-header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .profile-form {
                padding: 20px;
            }
        }
    </style>
    <script>
        function validateForm() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (password && password !== confirmPassword) {
                alert('Passwords do not match');
                return false;
            }
            
            return true;
        }
    </script>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Medical Image Analysis</h1>
            <div class="user-info">
                <span>Welcome, {{ user.first_name }}</span>
                <a href="{{ url_for('logout') }}" class="logout-btn">Logout</a>
            </div>
        </div>
        
        <div class="profile-container">
            <div class="profile-header">
                <div class="profile-info">
                    <div class="user-avatar">{{ user.first_name[0] }}{{ user.last_name[0] }}</div>
                    <div class="user-details">
                        <h2>{{ user.first_name }} {{ user.last_name }}</h2>
                        <p>{{ user.email }}</p>
                        <p>{{ user.hospital }}</p>
                    </div>
                </div>
                <div>
                    <a href="{{ url_for('home') }}" class="btn">Back to Home</a>
                </div>
            </div>
            
            <form class="profile-form" action="{{ url_for('profile') }}" method="POST" onsubmit="return validateForm()">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">First Name:</label>
                        <input type="text" id="first_name" name="first_name" value="{{ user.first_name }}" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name:</label>
                        <input type="text" id="last_name" name="last_name" value="{{ user.last_name }}" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="birth_date">Birth Date:</label>
                        <input type="date" id="birth_date" name="birth_date" value="{{ user.birth_date }}" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" value="{{ user.phone }}" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="hospital">Hospital/Medical Institution:</label>
                    <input type="text" id="hospital" name="hospital" value="{{ user.hospital }}" required>
                </div>
                
                <div class="form-group">
                    <label for="user_type">Professional Type:</label>
                    <select id="user_type" name="user_type" required>
                        <option value="government_doctor" {% if user.user_type == 'government_doctor' %}selected{% endif %}>Government Doctor</option>
                        <option value="private_doctor" {% if user.user_type == 'private_doctor' %}selected{% endif %}>Private Doctor</option>
                        <option value="researcher" {% if user.user_type == 'researcher' %}selected{% endif %}>Medical Researcher</option>
                        <option value="other" {% if user.user_type == 'other' %}selected{% endif %}>Other Medical Professional</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" value="{{ user.email }}" readonly>
                    <div class="password-info">Email cannot be changed</div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">New Password:</label>
                        <input type="password" id="password" name="password">
                        <div class="password-info">Leave blank to keep current password</div>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm New Password:</label>
                        <input type="password" id="confirm_password" name="confirm_password">
                    </div>
                </div>
                
                <div class="form-group" style="margin-top: 30px;">
                    <button type="submit" class="btn">Update Profile</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
