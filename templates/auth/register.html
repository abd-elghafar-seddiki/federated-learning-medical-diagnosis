<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Medical Diagnosis System</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Times New Roman', serif;
            background: linear-gradient(135deg, #f8f5f0 0%, #e8ddd4 100%);
            color: #2c3e50;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .auth-container {
            width: 100%;
            max-width: 1000px;
        }

        .auth-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            border: 1px solid #e8ddd4;
        }

        .auth-card h1, .auth-card h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
            font-family: 'Georgia', serif;
            border-bottom: 2px solid #d4af37;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #2c3e50;
        }

        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e8ddd4;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus, 
        .form-group select:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212,175,55,0.2);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn {
            display: inline-block;
            background: linear-gradient(135deg, #d4af37 0%, #b8860b 100%);
            color: white;
            padding: 12px 25px;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
            transition: all 0.3s ease;
            border: 2px solid #d4af37;
            cursor: pointer;
            font-size: 1em;
            width: 100%;
            margin-top: 10px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #b8860b 0%, #8b6914 100%);
            transform: scale(1.05);
            box-shadow: 0 5px 15px rgba(212,175,55,0.4);
        }

        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            font-weight: 500;
            text-align: center;
        }

        .alert-success {
            background-color: rgba(46, 204, 113, 0.2);
            border: 1px solid #2ecc71;
            color: #27ae60;
        }

        .alert-error {
            background-color: rgba(231, 76, 60, 0.2);
            border: 1px solid #e74c3c;
            color: #c0392b;
        }

        .alert-info {
            background-color: rgba(52, 152, 219, 0.2);
            border: 1px solid #3498db;
            color: #2980b9;
        }

        .password-strength {
            margin-top: 5px;
            font-size: 0.9em;
            font-weight: 500;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
        }

        .password-weak {
            background-color: rgba(231, 76, 60, 0.2);
            color: #c0392b;
        }

        .password-medium {
            background-color: rgba(241, 196, 15, 0.2);
            color: #d35400;
        }

        .password-strong {
            background-color: rgba(46, 204, 113, 0.2);
            color: #27ae60;
        }

        a {
            color: #b8860b;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #8b6914;
            text-decoration: underline;
        }

        @media (max-width: 900px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }
        }

        @media (max-width: 600px) {
            .auth-card {
                padding: 20px;
            }
        }
    </style>
    <script>
        function checkPasswordStrength() {
            const password = document.getElementById('password').value;
            const strengthText = document.getElementById('password-strength');
            
            if (password.length === 0) {
                strengthText.textContent = '';
                return;
            }
            
            let strength = 0;
            if (password.length >= 8) strength++;
            if (/[A-Z]/.test(password)) strength++;
            if (/[0-9]/.test(password)) strength++;
            if (/[^A-Za-z0-9]/.test(password)) strength++;
            
            if (strength <= 1) {
                strengthText.textContent = 'Weak';
                strengthText.className = 'password-strength password-weak';
            } else if (strength <= 3) {
                strengthText.textContent = 'Medium';
                strengthText.className = 'password-strength password-medium';
            } else {
                strengthText.textContent = 'Strong';
                strengthText.className = 'password-strength password-strong';
            }
        }
        
        function validateForm() {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            
            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return false;
            }
            
            return true;
        }
    </script>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>Medical Diagnosis System</h1>
            <h2>Create an Account</h2>
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}
            <form action="{{ url_for('register') }}" method="POST" onsubmit="return validateForm()">
                <div class="form-row">
                    <div class="form-group">
                        <label for="first_name">First Name:</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>
                    <div class="form-group">
                        <label for="last_name">Last Name:</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="birth_date">Birth Date:</label>
                        <input type="date" id="birth_date" name="birth_date" required>
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone Number:</label>
                        <input type="tel" id="phone" name="phone" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="hospital">Hospital/Medical Institution:</label>
                    <input type="text" id="hospital" name="hospital" required>
                </div>
                
                <div class="form-group">
                    <label for="user_type">Professional Type:</label>
                    <select id="user_type" name="user_type" required>
                        <option value="">Select your role</option>
                        <option value="government_doctor">Government Doctor</option>
                        <option value="private_doctor">Private Doctor</option>
                        <option value="researcher">Medical Researcher</option>
                        <option value="other">Other Medical Professional</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" required onkeyup="checkPasswordStrength()">
                        <div id="password-strength" class="password-strength"></div>
                    </div>
                    <div class="form-group">
                        <label for="confirm_password">Confirm Password:</label>
                        <input type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>
                
                <div class="form-group" style="margin-top: 20px;">
                    <button type="submit" class="btn">Register</button>
                </div>
            </form>
            <p style="margin-top: 20px; text-align: center;">
                Already have an account? <a href="{{ url_for('login') }}">Login here</a>
            </p>
        </div>
    </div>
</body>
</html>
